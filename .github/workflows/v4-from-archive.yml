name: Verify and build Kairus 4.0.0
on:
  workflow_dispatch:
  push:
    branches: [kairus-v4, main]
    paths: [Kairus-4.0.0-codigo.zip, .github/workflows/v4-from-archive.yml]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          echo "1a0ea64b61e7d825ec7284635feac7a9fbceb1f28544ea6e725730affae50139  Kairus-4.0.0-codigo.zip" | sha256sum -c -
          unzip -q Kairus-4.0.0-codigo.zip
          cd Kairus-4.0.0
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npm run mobile:android
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug --no-daemon)
          cp android/app/build/outputs/apk/debug/app-debug.apk ../Kairus-4.0.0-android.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose ../Kairus-4.0.0-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kairus-4.0.0-Android
          path: Kairus-4.0.0-android.apk
          if-no-files-found: error
