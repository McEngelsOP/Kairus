name: Build Kairus Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-from-archive.yml', 'Kairus-1.0.1-codigo.zip']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract and verify source
        run: |
          echo '4f9c978669aa5dc49591e7e1f5020a706c4f935c9649247fe61c7ba045561284  Kairus-1.0.1-codigo.zip' | sha256sum -c -
          unzip -q Kairus-1.0.1-codigo.zip
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build Android test package
        working-directory: Kairus
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npm run mobile:android
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug --no-daemon)
          mkdir -p ../release
          cp android/app/build/outputs/apk/debug/app-debug.apk ../release/Kairus-1.0.1-android.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose ../release/Kairus-1.0.1-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kairus-1.0.1-android
          path: release/Kairus-1.0.1-android.apk
          if-no-files-found: error
